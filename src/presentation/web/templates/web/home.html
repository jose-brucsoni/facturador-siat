{% extends "web/base.html" %}
{% block content %}
<h1>Demo PyME</h1>
<section>
  <h2>Emitir factura</h2>
  <form method="post" action="{% url 'web-emitir' %}">{% csrf_token %}
    <label>Cliente
      <select name="cliente_id">{% for c in clientes %}<option value="{{ c.id }}">{{ c.razon_social }}</option>{% endfor %}</select>
    </label>
    <label>Producto
      <select name="producto_id">{% for p in productos %}<option value="{{ p.id }}">{{ p.descripcion }}</option>{% endfor %}</select>
    </label>
    <button class="btn" type="submit">Emitir (stub 908)</button>
  </form>
</section>
<section>
  <h2>Historial</h2>
  <table>
    <tr><th>Nº</th><th>CUF</th><th>Estado</th><th>SIAT</th><th></th></tr>
    {% for f in facturas %}
    <tr>
      <td>{{ f.numero_factura }}</td>
      <td>{{ f.cuf|truncatechars:20 }}</td>
      <td>{{ f.estado_interno }}</td>
      <td>{{ f.estado_siat }}</td>
      <td><a href="{% url 'web-factura' f.id %}">Ver</a></td>
    </tr>
    {% empty %}
    <tr><td colspan="5">Sin facturas</td></tr>
    {% endfor %}
  </table>
</section>
{% endblock %}
